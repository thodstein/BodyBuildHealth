<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="telegram-web-app" content="true" />
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Hero остаются те же файлы: preload лишь ускоряет первый paint (APK + TG). -->
  <link rel="preload" as="image" type="image/webp" href="/hero-main.webp?v=20250827k" fetchpriority="high" />
  <title>Health Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overscroll-behavior: none; background: #0A0A0A; color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      overflow: hidden; touch-action: pan-y;
    }
    #app { height: 100%; display: flex; flex-direction: column; }
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px; position: relative; z-index: 1; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid #2A2A2A;
      border-top: 3px solid #C8F560; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Prevent text selection on mobile */
    .screen, .card, .nav-btn, .tab-btn, button { -webkit-user-select: none; user-select: none; }
    /* Smooth scrolling */
    main { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    /* Fix 100vh on mobile */
    :root { --vh: 1vh; }
    @supports (height: 1dvh) { :root { --vh: 1dvh; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <span style="color: #888888;">Загрузка Health Engine...</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
