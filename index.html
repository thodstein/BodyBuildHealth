<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="telegram-web-app" content="true" />
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Hero остаются те же файлы: preload лишь ускоряет первый paint (APK + TG). -->
  <link rel="preload" as="image" type="image/webp" href="/hero-main.webp?v=20250827k" fetchpriority="high" />
  <title>Health Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overscroll-behavior: none; background: #050b16; color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      overflow: hidden; touch-action: pan-y;
    }
    #app { height: 100%; display: flex; flex-direction: column; }
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px; position: relative; z-index: 1; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid #2A2A2A;
      border-top: 3px solid #C8F560; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Prevent text selection on mobile */
    .screen, .card, .nav-btn, .tab-btn, button { -webkit-user-select: none; user-select: none; }
    /* Smooth scrolling */
    main { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    /* Fix 100vh on mobile */
    :root { --vh: 1vh; }
    @supports (height: 1dvh) { :root { --vh: 1dvh; } }
    /* Boot-override: красится ТОЛЬКО когда boot-скрипт ниже выставил
       data-boot-theme (т.е. сохранена APK-тема). В TG ключей нет — 1-в-1. */
    html[data-boot-theme='light'] body { background: #eef2f6 !important; color: #0b1526 !important; }
    html[data-boot-theme='amoled'] body { background: #000 !important; }
    .loading-spinner { border-top-color: var(--boot-spin, #C8F560) !important; }
  </style>
  <script>
    // Boot anti-flash: до первого paint подкрасить static-заглушку под
    // сохранённую APK-тему/акцент. В TG ключей he_apk_* нет — no-op 1-в-1.
    try {
      var bt = null, ba = null;
      try { bt = localStorage.getItem('he_apk_theme_v1'); ba = localStorage.getItem('he_apk_accent_v1'); } catch (e) {}
      var ACC = { mint: '#00e68a', sky: '#38bdf8', violet: '#a78bfa', amber: '#fbbf24' };
      var root = document.documentElement;
      if (bt === 'light' || bt === 'amoled') root.setAttribute('data-boot-theme', bt);
      var hex = ACC[ba] || null;
      if (!hex && ba === 'system') {
        try {
          var sh = localStorage.getItem('he_apk_system_hex_v1');
          if (sh) hex = sh.split('|')[0];
        } catch (e) {}
      }
      if (hex && /^#[0-9a-fA-F]{6}$/.test(hex)) root.style.setProperty('--boot-spin', hex);
    } catch (e) {}
  </script>
  <script>
    // Boot watchdog: если модульный бандл не стартовал за 20с (битая/старая
    // web-сборка внутри APK, слишком старый WebView, зависший шаг bootstrap) —
    // показать диагностику вместо вечного спиннера. main.tsx гасит его флагом
    // window.__appBooted после первого рендера. В TG/web при нормальном старте
    // скрипт ничего не рисует — 1-в-1.
    (function () {
      try {
        window.__bootErrors = window.__bootErrors || [];
        window.__bootLog = window.__bootLog || [];
        function stamp(msg) { try { window.__bootLog.push(new Date().toISOString().slice(11, 19) + ' ' + msg); } catch (e) {} }
        window.addEventListener('error', function (e) {
          try {
            var t = e.target;
            var url = (t && (t.src || t.href)) || '';
            var msg = e.message || (url ? 'resource-load-failed' : 'error');
            window.__bootErrors.push(msg + (url ? ' :: ' + url : ''));
          } catch (err) {}
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          try { window.__bootErrors.push('promise: ' + ((e.reason && e.reason.message) || String(e.reason))); } catch (err) {}
        });
        stamp('watchdog-armed');
        setTimeout(function () {
          try {
            if (window.__appBooted) return;
            if (document.getElementById('he-boot-watchdog')) return;
            var errs = window.__bootErrors.slice(-6);
            var log = window.__bootLog || [];
            var moduleDead = log.length <= 1;
            var hasAssetFail = errs.some(function (m) { return m.indexOf('assets/') !== -1; });
            var hint;
            if (moduleDead) {
              hint = 'Код приложения даже не стартовал. Причины: битая web-сборка внутри APK либо слишком старый Android System WebView. Обновите WebView в Play Store, полностью удалите приложение и поставьте свежий APK.';
            } else if (hasAssetFail) {
              hint = 'Похоже, в APK битая или неполная web-сборка (не загрузились файлы assets/). Решение: пересобрать командой npm run build:native и переустановить APK.';
            } else {
              hint = 'Старт застрял на шаге: ' + (log.length ? log[log.length - 1] : 'неизвестно') + '. Чаще всего помогает перезагрузка; если повторяется — сбросьте локальные данные (аккаунт Telegram сохранится в облаке, локальный дневник — нет).';
            }
            var diag = 'UA: ' + (navigator.userAgent || '?') + '\n'
              + 'online: ' + (navigator.onLine ? 'yes' : 'no') + '\n'
              + 'bootLog: ' + (window.__bootLog.join(' | ') || '-') + '\n'
              + 'errors: ' + (errs.join(' ;; ') || 'none');
            var box = document.createElement('div');
            box.id = 'he-boot-watchdog';
            box.setAttribute('role', 'alert');
            box.style.cssText = 'position:fixed;inset:0;z-index:10000;background:#050b16;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;gap:12px;';
            var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
            box.innerHTML = '<h2 style="margin:0;font-size:18px;">⚠️ Не удалось загрузить приложение</h2>'
              + '<p style="margin:0;color:#aaa;font-size:14px;max-width:420px;">' + esc(hint) + '</p>'
              + '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">'
              + '<button id="he-boot-reload" style="padding:12px 20px;min-height:44px;background:#007aff;color:#fff;border:none;border-radius:8px;font-size:15px;">⟳ Перезагрузить</button>'
              + '<button id="he-boot-wipe" style="padding:12px 20px;min-height:44px;background:#3a3a3c;color:#fff;border:none;border-radius:8px;font-size:15px;">🗑 Сбросить данные</button>'
              + '<button id="he-boot-copy" style="padding:12px 20px;min-height:44px;background:#3a3a3c;color:#fff;border:none;border-radius:8px;font-size:15px;">📋 Диагностика</button>'
              + '</div>'
              + '<pre id="he-boot-diag" style="display:block;max-width:100%;overflow:auto;text-align:left;font-size:11px;color:#8e8e93;background:#0a0a0f;border:1px solid #2a2a2a;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text;">' + esc(diag) + '</pre>';
            document.body.appendChild(box);
            document.getElementById('he-boot-reload').onclick = function () { location.reload(); };
            document.getElementById('he-boot-wipe').onclick = function () {
              try { localStorage.clear(); } catch (e) {}
              try { indexedDB.deleteDatabase('HealthEngineDB_v3'); } catch (e) {}
              location.reload();
            };
            document.getElementById('he-boot-copy').onclick = function () {
              var pre = document.getElementById('he-boot-diag');
              if (pre) pre.style.display = pre.style.display === 'none' ? 'block' : 'none';
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(diag).catch(function () { legacyCopy(diag); });
                } else {
                  legacyCopy(diag);
                }
              } catch (e) { legacyCopy(diag); }
            };
            function legacyCopy(text) {
              try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
              } catch (e) {}
            }
          } catch (e) {}
        }, 20000);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <span style="color: #888888;">Загрузка Health Engine...</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
