# Android APK — сборка без Android Studio
#
# Один код → два артефакта: Telegram Mini App (Vercel, dist/) и APK (dist/ + Capacitor).
# Собирает debug-APK — ставится на телефон сразу. Подписанный release для сторов —
# отдельный шаг, когда будет keystore (см. docs/NATIVE-APP.md §7 «Подпись release»).
name: android-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Web build + Capacitor sync
        run: npm run build:native

      # OTA-бандл: zip свежего dist/ (корень = index.html) для подтягивания
      # файлов внутрь установленного APK без переустановки (LiveUpdate).
      - name: Pack web bundle for OTA
        run: |
          cd dist
          zip -qr ../web-bundle.zip . -x 'assets/*.map'
          cd ..
          ls -la web-bundle.zip

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: he-web-bundle
          path: web-bundle.zip
          if-no-files-found: error

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: he-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # PRO-release: подписанный AAB (Play/RuStore) + signed APK.
  # Требует секретов (см. docs/NATIVE-APP.md §7): ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
  # Без секретов job корректно пропускается (debug-артефакт выше не страдает).
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # secrets нельзя использовать прямо в `if` (Invalid workflow file) —
    # поэтому пробрасываем их в env job'а (там можно), а гейты — по env.
    # Без секретов env пустые и все шаги ниже корректно пропускаются.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Web build + Capacitor sync
        run: npm run build:native

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Restore keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/he-release.keystore
          printf 'storeFile=he-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties

      - name: Assemble release AAB + APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: he-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: he-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Лента обновлений без сторов: по тегу v* публикует GitHub Release с APK.
  # Приложение проверяет его через api.github.com (движок src/core/app-updater.ts,
  # оверрайд — VITE_APP_UPDATE_URL). Подписанный APK — приоритетом (единая подпись
  # всех CI-сборок — см. signingConfig debug в build.gradle).
  publish:
    needs: [build, release]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: he-debug-apk
          path: ./artifacts

      - name: Download signed APK (if built)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: he-release-apk
          path: ./artifacts-signed

      - name: Download web bundle (OTA)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: he-web-bundle
          path: ./artifacts-bundle

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES=""
          if [ -f ./artifacts/app-debug.apk ]; then
            FILES="$FILES ./artifacts/app-debug.apk"
          fi
          if [ -f ./artifacts-signed/app-release.apk ]; then
            FILES="$FILES ./artifacts-signed/app-release.apk"
          fi
          if [ -f ./artifacts-bundle/web-bundle.zip ]; then
            cp ./artifacts-bundle/web-bundle.zip "./web-bundle-$TAG.zip"
            FILES="$FILES ./web-bundle-$TAG.zip"
          fi
          if [ -z "$FILES" ]; then
            echo "::error::Красная сборка: ни одного APK нет — публиковать нечего, релиз не трогаем"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $FILES --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $FILES \
              --title "Health Engine $TAG" \
              --notes "APK + web-bundle для самообновления без сторов. Приложение само предложит: быстрое обновление (файлы внутрь, без переустановки) или полный APK поверх (данные сохраняются). Требуется та же подпись сборки — все CI-сборки подписываются единым ключом."
          fi
